<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Login</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#667eea,#764ba2);
    }

    .login-box{
      width:360px;
      padding:35px;
      border-radius:20px;
      background:rgba(255,255,255,.15);
      backdrop-filter:blur(15px);
      box-shadow:0 15px 35px rgba(0,0,0,.2);
      color:white;
    }

    .logo{
      width:75px;
      height:75px;
      border-radius:50%;
      background:white;
      color:#6C63FF;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      margin:0 auto 15px;
      font-weight:bold;
    }

    h2{
      text-align:center;
      margin-bottom:5px;
    }

    .sub{
      text-align:center;
      opacity:.85;
      font-size:13px;
      margin-bottom:25px;
    }

    .input-group{
      margin-bottom:16px;
    }

    .input-group label{
      display:block;
      font-size:13px;
      margin-bottom:6px;
    }

    .input-group input{
      width:100%;
      padding:12px 14px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:14px;
    }

    .password-wrap{
      position:relative;
    }

    .toggle{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
      color:#666;
      font-size:13px;
      user-select:none;
    }

    button{
      width:100%;
      padding:13px;
      border:none;
      border-radius:10px;
      background:white;
      color:#6C63FF;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:.25s;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 18px rgba(0,0,0,.15);
    }

    .message{
      min-height:20px;
      text-align:center;
      font-size:13px;
      margin-top:12px;
      color:#FFD5D5;
      font-weight:bold;
    }

    .footer{
      text-align:center;
      margin-top:20px;
      font-size:12px;
      opacity:.8;
    }
  </style>
</head>
<body>

<div class="login-box">

  <div class="logo">K</div>

  <h2>Kasir POS</h2>
  <div class="sub">Silakan login untuk melanjutkan</div>

  <div class="input-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username">
  </div>

  <div class="input-group">
    <label>Password</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="Masukkan password">
      <span class="toggle" onclick="togglePass()">Lihat</span>
    </div>
  </div>

  <button onclick="login()">LOGIN</button>

  <div id="msg" class="message"></div>

  <div class="footer">© 2026 Kasir System</div>

</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyWXOAIc_lWY35fVUrODhKpmjKvR5aiUW6Rz2I-s4dWRPf2S70m9IQabslLkeTN_0zmzg/exec";

if(localStorage.getItem("isLogin")==="true"){
  window.location.href="kasir.html";
}

function togglePass(){
  const pass=document.getElementById("password");
  const btn=document.querySelector(".toggle");

  if(pass.type==="password"){
    pass.type="text";
    btn.innerHTML="Sembunyi";
  }else{
    pass.type="password";
    btn.innerHTML="Lihat";
  }
}

function showMessage(text,color="#FFD5D5"){
  const msg=document.getElementById("msg");
  msg.style.color=color;
  msg.innerHTML=text;
}

function login(){
  const user=document.getElementById("username").value.trim();
  const pass=document.getElementById("password").value.trim();

  if(!user || !pass){
    showMessage("Username dan password wajib diisi");
    return;
  }

  showMessage("Memproses...","#FFFFFF");

  fetch(GAS_URL,{
    method:"POST",
    body:JSON.stringify({
      username:user,
      password:pass
    })
  })
  .then(res=>res.json())
  .then(res=>{
    if(res.success){

      localStorage.setItem("isLogin","true");
      localStorage.setItem("nama",res.nama);
      localStorage.setItem("role",res.role);

      showMessage("Login berhasil","#A8FFB0");

      setTimeout(()=>{
        window.location.href="kasir.html";
      },700);

    }else{
      showMessage(res.message);
    }
  })
  .catch(()=>{
    showMessage("Koneksi ke server gagal");
  });
}

document.getElementById("password").addEventListener("keypress",function(e){
  if(e.key==="Enter"){
    login();
  }
});
</script>

</body>
</html>
